openapi: 3.0.2
info:
    title: API
    version: 1.0.0
paths:
    /:
        post:
            requestBody:              
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pessoa'
                required: true         
            responses:
                '201':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pessoa'
                    description: Created
components:
    schemas:
        pessoa:
            required:                 
                - nome
                - nascimento
                - genero
            type: object
            properties:
                nome:
                    type: string
                nascimento:
                    format: date
                    type: string
                genero:
                    enum:             
                        - M
                        - F
                        - O
                        - X 
                    type: string
            example:
                nome: fulano
                nascimento: '2000-12-31'
                genero: M