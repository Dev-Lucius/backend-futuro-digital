openapi: 3.0.2
info:
    title: New API
    version: 1.0.0
paths:
    '/produto/{codigo}/saida/{quantidade}':
        put:
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                type: string
                    description: Ok
        parameters:
            -
                name: codigo
                schema:
                    type: integer
                in: path
                required: true
            -
                name: quantidade
                schema:
                    type: integer
                in: path
                required: true
