openapi: 3.0.2
info:
    title: API
    version: 1.0.0
paths:
    /:
        get:
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                type: array                 # ← retorna uma LISTA
                                items:
                                    $ref: '#/components/schemas/pessoa'  # ← cada item é uma "pessoa"
                    description: Ok
components:
    schemas:
        pessoa:
            type: object
            properties:
                nome:
                    type: string
                nascimento:
                    format: date
                    type: string
                genero:
                    type: string
            example:
                nome: fulano
                nascimento: '2000-12-31'
                genero: M