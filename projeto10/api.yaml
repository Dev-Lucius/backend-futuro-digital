openapi: 3.0.2
info:
    title: API
    version: 1.0.0
paths:
    '/{codigo}':
        parameters:
            -
                name: codigo
                schema:
                    type: integer
                in: path
                required: true
        put:
            parameters:
                -
                    name: query1
                    schema:
                        type: string
                    in: query
                    required: true
                -
                    name: query2
                    schema:
                        type: integer
                    in: query
                    required: false
                -
                    name: header1
                    schema:
                        type: string
                    in: header
                    required: true
                -
                    name: header2
                    schema:
                        type: integer
                    in: header
                    required: false
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pessoa1'
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pessoa2'
                    description: Ok
components:
    schemas:
        pessoa1:
            required:
                - nome
                - nascimento
                - genero
            type: object
            properties:
                nome:
                    type: string
                nascimento:
                    format: date
                    type: string
                genero:
                    enum:
                        - M
                        - F
                    type: string
            example:
                nome: fulano
                nascimento: '2000-12-31'
                genero: M
        pessoa2:
            type: object
            properties:
                codigo:
                    type: integer
                nome:
                    type: string
                nascimento:
                    format: date
                    type: string
                genero:
                    type: string
            example:
                codigo: 1
                nome: fulano
                nascimento: '2000-12-31'
                genero: M